[project]
name = "checaai-ingestao"
version = "0.1.0"
description = "Coletores do ChecaAI: baixam as fontes públicas e gravam a camada bronze em Parquet."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
checaai-coletar = "checaai_ingestao.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
